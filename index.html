<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Entre na call de áudio do schuteiraDisc e compartilhe sua tela. Sem cadastro."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>schuteiraDisc</title>
  </head>
  <body>
    <div id="gate" class="gate">
      <div class="gate-card">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="56" height="56">
            <rect width="64" height="64" rx="16" fill="#1db954" />
            <path
              d="M18 38c8-14 28-16 32-6-7 2-16 8-20 18-6-4-10-8-12-12z"
              fill="#0b1a12"
            />
            <circle cx="24" cy="28" r="3" fill="#e8ffe8" />
          </svg>
        </div>
        <h1>schuteiraDisc</h1>
        <p class="lede">
          Uma sala só. Entra, fala e compartilha a tela do computador.
        </p>
        <form id="join-form" class="join-form">
          <label for="nick">Como você quer aparecer</label>
          <input
            id="nick"
            name="nick"
            type="text"
            maxlength="24"
            autocomplete="nickname"
            placeholder="Seu apelido"
          />
          <button type="submit" id="join-btn">Entrar na call</button>
          <p id="gate-error" class="error" hidden></p>
        </form>
        <p class="hint">Precisa do microfone. A tela é opcional, depois que entrar.</p>
      </div>
    </div>

    <div id="app" class="app" hidden>
      <aside class="sidebar">
        <header class="brand">
          <img src="/favicon.svg" alt="" width="28" height="28" />
          <div>
            <strong>schuteiraDisc</strong>
            <span id="status">Conectando…</span>
          </div>
        </header>
        <h2>Na call</h2>
        <ul id="peers" class="peers"></ul>
      </aside>

      <main class="main">
        <section id="stage" class="stage" aria-label="Telas compartilhadas">
          <div id="stage-bar" class="stage-bar" hidden>
            <span class="stage-bar-label">Ver telas</span>
            <div id="view-modes" class="view-modes"></div>
          </div>
          <div id="empty-stage" class="empty-stage">
            <p>Ninguém está compartilhando a tela</p>
            <span>Clique em Compartilhar tela quando quiser mostrar o computador.</span>
          </div>
          <div id="screens" class="screens"></div>
        </section>

        <footer class="controls">
          <button id="mute-btn" class="control" type="button" aria-pressed="false">
            <span class="icon" aria-hidden="true"></span>
            <span class="label">Silenciar</span>
          </button>
          <button id="share-btn" class="control primary" type="button" aria-pressed="false">
            <span class="icon" aria-hidden="true"></span>
            <span class="label">Compartilhar tela</span>
          </button>
          <button id="leave-btn" class="control danger" type="button">
            <span class="icon" aria-hidden="true"></span>
            <span class="label">Sair</span>
          </button>
        </footer>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
